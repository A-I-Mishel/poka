# Poka Streamlit theme — official theming layer (visual only).
#
# Premium dark + accent matching ui/theme.py section 29. Native widgets
# follow the same deep base so unstyled controls never flash gray.
# All detailed styling still lives in ui/theme.py.

[theme]
base = "dark"
primaryColor = "#7c6cff"
backgroundColor = "#131318"
secondaryBackgroundColor = "#0e0e14"
textColor = "#ffffff"
