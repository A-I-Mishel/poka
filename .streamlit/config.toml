# Poka Streamlit theme — official theming layer (visual only).
#
# Matches the premium design-system variables in ui/theme.py so native
# Streamlit controls use the Poka accent instead of the default
# Streamlit primary color. All detailed styling still lives in
# ui/theme.py; this only aligns native defaults.

[theme]
base = "dark"
primaryColor = "#7566ff"
backgroundColor = "#08080c"
secondaryBackgroundColor = "#0e0e13"
textColor = "#f4f4f6"
