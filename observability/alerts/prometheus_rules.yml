groups:
  - name: pluto.rules
    interval: 30s
    rules:
      # Golden signals.
      # Budgets mirror load-test/k6-scenarios.js per-scenario SLOs:
      # simple_chat 3s, upload/download + kb_search 5s, upload_kb 10s,
      # deep_mode 15s, sse_stream 30s; release gate error < 1%.
      # Paging stays coarser than the release gate by design (5% vs 1%):
      # CI blocks the release, the pager wakes a human.
      - alert: HighErrorRate
        expr: |
          sum(rate(pluto_http_requests_total{status_code=~"5.."}[5m]))
          / sum(rate(pluto_http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate (>5%; release gate is 1%)"
          description: "{{ $value | humanizePercentage }} of requests failing"

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(pluto_http_request_duration_seconds_bucket{endpoint!="/api/chat/stream"}[5m])) by (le)) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency > 10s on interactive endpoints (stream excluded)"
          description: "p95 = {{ $value }}s"

      # Streaming + Deep Mode legitimately run long (k6: deep 15s, SSE 30s):
      # a separate budget so normal deep answers don't page the 10s alert.
      - alert: SlowStreamLatency
        expr: |
          histogram_quantile(0.95, sum(rate(pluto_http_request_duration_seconds_bucket{endpoint="/api/chat/stream"}[5m])) by (le)) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Stream p95 > 30s (deep/SSE budget)"
          description: "p95 = {{ $value }}s"

      # LLM cascade
      - alert: CascadeExhausted
        expr: |
          increase(pluto_llm_tier_fallbacks_total[5m]) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High cascade fallback rate"
          description: "{{ $value }} fallbacks in 5m \u2014 free tiers may be exhausted"

      - alert: TierUnavailable
        expr: |
          sum(rate(pluto_llm_provider_errors_total[5m])) by (tier) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Tier {{ $labels.tier }} error rate high"
          description: "Error rate: {{ $value }}/s"

      # Rate limits
      - alert: RateLimitSaturation
        expr: |
          sum(rate(pluto_rate_limit_rejections_total[5m])) by (action) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Rate limit rejections for {{ $labels.action }}"
          description: "{{ $value }} rejections/s"

      # Storage
      - alert: DiskSpaceLow
        expr: |
          (pluto_storage_free_bytes / pluto_storage_total_bytes) < 0.15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space < 15%"
          description: "{{ $value | humanizePercentage }} free"

      - alert: MigrationStuck
        expr: |
          pluto_storage_migration_status == -1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Storage migration failed for user {{ $labels.user_id }}"

      # System
      - alert: HighMemoryUsage
        expr: |
          process_resident_memory_bytes / 1024 / 1024 / 1024 > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory > 2GB"
          description: "RSS = {{ $value }} GB"
