[project]
name = "pluto-smart-task-agent"
version = "0.1.0"
description = "Pluto — Smart Task Agent (free-tier multi-model assistant)"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# Hermetic suite: every test stubs models/network (no quota, no API calls).
addopts = ["-q"]

[tool.coverage.run]
source = ["backend", "services", "agent", "tools", "config"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60

[tool.ruff]
target-version = "py312"
fix = false

[tool.ruff.lint]
# CI gate: pyflakes correctness (unused imports/vars, undefined names)
# plus pycodestyle runtime errors. Style rules stay advisory (too noisy
# for a mixed-age codebase); widen the select list incrementally.
select = ["F", "E9"]
