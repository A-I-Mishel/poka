[project]
name = "pluto-smart-task-agent"
version = "0.1.0"
description = "Pluto — Smart Task Agent (free-tier multi-model assistant)"
requires-python = ">=3.12"
# Empty on purpose: requirements.lock (compiled from requirements.txt via
# `uv pip compile --universal --generate-hashes --python-version 3.12`)
# is the install source for CI, Docker, and Render. `pip install -e .`
# installs nothing and is unsupported.
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# Hermetic suite: every test stubs models/network (no quota, no API calls).
addopts = ["-q"]

[tool.coverage.run]
source = ["backend", "services", "agent", "tools", "config"]
omit = [
  "tests/*",
  "*/__init__.py",
  # FAISS index is best-effort WIP (omit from floor)
  "services/kb_index.py",
  "scripts/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 65

[tool.ruff]
target-version = "py312"
fix = false

[tool.ruff.lint]
# CI gate: pyflakes correctness + pycodestyle runtime errors + security
# (S) + bugbear (B) for raise-from/default-arg hygiene. Noisy legacy
# rules stay off (UP006/UP045 annotations, UP031 printf, I001 import
# sort, S101 asserts in tests) — enable incrementally.
select = ["F", "E9", "S", "B"]
ignore = [
  "S101",  # asserts are the test suite's language
  "B904",  # router/service exception mapping to HTTPException/AccountError
            # is FastAPI idiom; new code uses `raise ... from e` anyway.
# Grandfathered pre-existing noise — fix incrementally, new code must
  # not add more (S110/S112 best-effort hygiene).
  # Cleared: S310 (single _https_get funnel), S106/S107 (noqa + tests
  # per-file), S324 (usedforsecurity=False), S311 (noqa jitter),
  # S608 (validated/quoted idents), S324 (entity pre-filter + noqa),
  # B023 (bound loop var), S603 (fixed argv + noqa), S306 (tmp_path),
  # B905 (strict= on equal-by-construction zips).
  "UP006", "UP045", "UP031", "UP035", "I001",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S110", "S112", "B017", "S106", "S107"]  # S106/S107: password literals are test fixtures, never credentials
"chaos/*" = ["S603", "S607"]  # local operator tooling, fixed argv, shell=False
"scripts/*" = ["S603", "S607"]
"locustfile.py" = ["S311"]  # test data randomness, not crypto
# FastAPI Depends() in defaults is canonical usage, not a mutable-arg bug.
"backend/**/*.py" = ["B008"]
# Documented best-effort hygiene: never-raises helpers degrade silently by design.
"backend/deps.py" = ["B008"]
"backend/main.py" = ["B008"]
