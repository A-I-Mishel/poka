name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch/PR: a new push cancels the stale run behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest pytest-cov ruff
      - name: Compile all Python files
        run: python -m compileall -q backend config.py services tools agent tests
      - name: "Lint (ruff: pyflakes + runtime errors)"
        run: python -m ruff check backend config.py services agent tools tests
      - name: Run tests with coverage (mocked providers, no API calls)
        run: python -m pytest tests/ --cov=backend --cov=services --cov=agent --cov=tools --cov=config --cov-report=term-missing --cov-fail-under=65
      - name: Validate observability + deploy config
        run: |
          pip install pyyaml
          python -c "import json,glob,sys; files=glob.glob('observability/dashboards/*.json'); assert files, 'no dashboards tracked — observability/ must be committed'; [json.load(open(f)) for f in files]; print('dashboards ok: %d' % len(files))"
          python -c "import yaml; d=yaml.safe_load(open('render.yaml')); assert d['services'][0]['healthCheckPath']=='/api/health', 'healthCheckPath drift'; print('render ok')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax-check client modules
        run: for f in src/*.js; do node --check "$f" || exit 1; done
      - name: Unit tests (vitest)
        run: npm test
      - name: Lint (eslint: no-undef/unused/redeclare)
        run: npm run lint
      - name: Typecheck (tsc, @ts-check pure modules)
        run: npm run typecheck
      - name: Module wiring smoke (node stubs)
        run: npm run smoke
      - name: Production build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E smoke (real backend + Vite, zero page errors)
        working-directory: frontend
        run: npm run test:e2e

  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pre-commit (secrets, whitespace, ruff)
        uses: pre-commit/action@v3.0.1

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pip-audit
      - name: Dependency vulnerability audit (advisory)
        run: pip-audit
