name: Observability & Profiling

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 0"  # Weekly profiling

jobs:
  test-with-profiling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install py-spy scalene pytest

      - name: Run tests with py-spy
        run: |
          py-spy record -o profile.pb.gz --rate 100 -- pytest -q --tb=short
        env:
          PLUTO_AUTH_MODE: open

      - name: Run scalene profile (subset)
        run: |
          scalene --json --outfile scalene.json -m pytest tests/test_benchmarks.py -q
        continue-on-error: true

      - name: Upload profiles
        uses: actions/upload-artifact@v4
        with:
          name: profiles
          path: |
            profile.pb.gz
            scalene.json
          retention-days: 7

  build-docker:
    runs-on: ubuntu-latest
    needs: test-with-profiling
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pluto:test .
      - name: Smoke test
        run: |
          docker run -d --name pluto -p 8000:8000 -e PORT=8000 -e PLUTO_AUTH_MODE=open -e PLUTO_ALLOW_OPEN=true pluto:test
          # Readiness loop: a fixed sleep races cold uvicorn imports and
          # curl fails with 56 (proxy accepts, nobody listening yet).
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && break
            sleep 5
          done
          curl -f http://localhost:8000/api/health
          curl -f http://localhost:8000/api/metrics | head -20
          docker stop pluto
