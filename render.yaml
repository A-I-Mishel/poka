# Render blueprint for the Pluto API (long-running backend).
# The web UI lives on Vercel; this keeps minutes-long agent runs,
# ~500MB Python deps, and on-disk chats/uploads/memory alive.
# Dashboard: New > Blueprint > connect repo > fill the empty env vars.
# After deploy, set VITE_API_URL in Vercel to this service's URL.

services:
  - type: web
    name: pluto-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: OPENCODE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: PLUTO_FRONTEND_ORIGIN
        value: https://poka-nine.vercel.app
      - key: PLUTO_AUTH_MODE
        value: open
      # Persistent storage for accounts + chats + uploads + memory.
      # Without this, data/accounts.json lives on the ephemeral filesystem
      # and every redeploy/restart wipes all accounts: old tokens 401 and
      # /login fails with "Invalid username or password", forcing users to
      # sign up again with the same name. The disk keeps PLUTO_DATA_DIR
      # alive across deploys. NOTE: Render disks need a paid instance
      # (Starter or higher) — on the free tier the filesystem is ephemeral
      # and logins will keep resetting; either upgrade or self-host with a
      # Docker volume (see README) for durable logins.
      - key: PLUTO_DATA_DIR
        value: /var/pluto-data
    disk:
      name: pluto-data
      mountPath: /var/pluto-data
      sizeGB: 1
