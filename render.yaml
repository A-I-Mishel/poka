# Render blueprint for the Pluto API (long-running backend).
# The web UI lives on Vercel; this keeps minutes-long agent runs,
# ~500MB Python deps, and on-disk chats/uploads/memory alive.
# Dashboard: New > Blueprint > connect repo > fill the empty env vars.
# After deploy, set VITE_API_URL in Vercel to this service's URL.

services:
  - type: web
    name: pluto-api
    runtime: python
    buildCommand: "pip install -r requirements.lock"
    # --proxy-headers: Render terminates TLS at its load balancer and
    # forwards plain HTTP + X-Forwarded-Proto. Without this uvicorn
    # reports scheme=http, so Secure/SameSite=None session cookies fall
    # back to Lax and Vercel-UI logins never stick (401 loop).
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GITHUB_MODELS_TOKEN
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: PLUTO_FRONTEND_ORIGIN
        sync: false
      - key: PLUTO_AUTH_MODE
        value: private
      - key: PLUTO_ACCESS_TOKENS
        sync: false
      - key: PLUTO_TRUST_PROXY
        value: true
      - key: REDIS_URL
        sync: false
      - key: PLUTO_HEALTH_PROBE
        value: 1
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      # Persistent storage for accounts + chats + uploads + memory.
      # Without this, data/accounts.json lives on the ephemeral filesystem
      # and every redeploy/restart wipes all accounts: old tokens 401 and
      # /login fails with "Invalid username or password", forcing users to
      # sign up again with the same name. The disk keeps PLUTO_DATA_DIR
      # alive across deploys. NOTE: Render disks need a paid instance
      # (Starter or higher) — on the free tier the filesystem is ephemeral
      # and logins will keep resetting; either upgrade or self-host with a
      # Docker volume (see README) for durable logins.
      - key: PLUTO_DATA_DIR
        value: /var/pluto-data
      # Free-tier durability alternative: snapshots (services/snapshots.py).
      # When these are set, data/ is mirrored to S3-compatible storage and
      # restored on boot, so free-tier restarts stop wiping accounts.
      # Cloudflare R2 (10 GB free, needs a card): fill all four R2_* vars.
      # Supabase Storage (1 GB free, no card): enable the S3 protocol in the
      # Storage settings, create a private bucket, generate S3 access keys,
      # then set R2_BUCKET/R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY plus
      # SNAPSHOT_ENDPOINT_URL and SNAPSHOT_REGION below (R2_ACCOUNT_ID
      # stays empty — it is only used to build the default R2 endpoint).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: SNAPSHOT_ENDPOINT_URL
        sync: false
      - key: SNAPSHOT_REGION
        sync: false
      - key: SNAPSHOT_INTERVAL_SECONDS
        value: 10
    disk:
      name: pluto-data
      mountPath: /var/pluto-data
      sizeGB: 1
